name: Gerar AAB Android para Google Play

on:
  push:
    branches:
      - codex/android-play-bundle
    paths:
      - android-app/**
      - meu-gado-logo.png
      - .github/workflows/android-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar pacote Android
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        working-directory: android-app
        run: npx cap add android

      - name: Definir Android mínimo exigido pela Proteção Automática
        working-directory: android-app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/variables.gradle")
          original = path.read_text()
          updated, count = re.subn(r"(?m)^(\s*minSdkVersion\s*=\s*)\d+", r"\g<1>24", original)
          if count != 1:
              raise SystemExit("minSdkVersion não encontrado exatamente uma vez")
          path.write_text(updated)
          PY
          grep 'minSdkVersion = 24' android/variables.gradle

      - name: Instalar configuração do Firebase
        working-directory: android-app
        shell: bash
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Sincronizar projeto Android
        working-directory: android-app
        run: npx cap sync android

      - name: Instalar gerador de ícones
        run: python -m pip install Pillow

      - name: Aplicar ícone oficial do Meu Gado
        run: python android-app/scripts/prepare_icons.py

      - name: Compilar AAB sem assinatura
        working-directory: android-app/android
        run: ./gradlew bundleRelease

      - name: Guardar AAB para assinatura com chave de upload
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Gado-AAB-sem-assinatura
          path: android-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

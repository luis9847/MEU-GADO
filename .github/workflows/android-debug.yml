name: Gerar APK de teste Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: APK de teste
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Adicionar configuração do Firebase
        shell: bash
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Gerar APK de teste
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meu-Gado-APK-teste
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
